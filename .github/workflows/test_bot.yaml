name: Test Bot

on:
  workflow_dispatch:
    inputs:
      research_engine:
        # A/B for claude_research: same unscored practice questions, research
        # by Sonnet 5.5 (production default) or Haiku 5.5. Compare the
        # "claude_research engine=..." log lines and the research text.
        description: "Claude research engine (sonnet | haiku)"
        required: false
        default: "sonnet"
        type: choice
        options: ["sonnet", "haiku"]

# Least privilege: this job calls external APIs and never writes to the
# repository, opens a PR or publishes a package. Without this it inherits
# the repository-wide default, which is broader than anything here needs.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  forecast_job:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true
      - name: Install dependencies
        run: poetry install --no-interaction --no-root
      # Activates the pinned llms block in main.py, then --check sends one tiny
      # completion to each model. A dead model id is what broke every earlier run,
      # and it is cheaper to find out here than four minutes into a bot run.
      # Must go through poetry: --check imports litellm, which lives in the venv.
      - name: Pin and verify LLM models
        run: poetry run python backtest/pin_models.py --check
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Without these, pin_models emits a single GeneralLlm per role and
          # this smoke test exercises a configuration production never runs --
          # no fallback ladder, no forecaster ensemble. Run 34114505848 died on
          # OpenRouter's free daily cap with nothing behind it, which is
          # precisely the failure production is built to survive. A pre-flight
          # check that does not check the real thing is worse than none.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Gates the researcher's news feed at PATCH time, like the keys
          # above: pin_models leads the researcher with AskNews only when one
          # of these is present here. Absent (no secret set) means no change.
          # Must match the Run bot step; test_production_invariants compares.
          ASKNEWS_API_KEY: ${{ secrets.ASKNEWS_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
      - name: Run bot
        run: |
          poetry run python main.py --mode test_questions
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_RESEARCH_ENGINE: ${{ inputs.research_engine }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ASKNEWS_API_KEY: ${{ secrets.ASKNEWS_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
