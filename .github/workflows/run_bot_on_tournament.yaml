name: Forecast on new AI tournament questions

on:
  workflow_dispatch:
  schedule:
    # MEASURED, not assumed. Over the 200 most recent runs
    # (2026-08-18T21:59Z .. 2026-08-23T21:31Z) the declared `*/5` schedule
    # produced:
    #     gap median 32.2 min, p75 41.5, p90 55.7, max 109.3, mean 36.0
    #     gaps <= 10 min: 0 of 199
    # That is ~14% of the requested 12 events/hour. An earlier comment here
    # claimed `*/5` buys "~5 min" detection; the data contradicts it and the
    # claim has been removed.
    #
    # The cause is delivery, not this repository:
    #   * queue delay (startedAt - createdAt) was 0s on all 200 runs, so the
    #     concurrency group below is not holding anything back;
    #   * run duration is 62s median / 292s max, so runs are not overlapping
    #     into each other;
    #   * GitHub documents the mechanism directly -- "The schedule event can
    #     be delayed during periods of high loads of GitHub Actions workflow
    #     runs. High load times include the start of every hour. If the load
    #     is sufficiently high enough, some queued jobs may be dropped."
    # Events are being DROPPED upstream. Nothing in this repository can raise
    # the delivery rate.
    #
    # What this cron changes is PHASE, which is the one lever GitHub does
    # offer: it recommends "scheduling workflows at different times within
    # the hour rather than at the start". `*/5` fires at :00,:05,:10... --
    # precisely the minutes every other `*/5` and `*/15` cron on the platform
    # also asks for. The list below keeps the same 12 requests per hour and
    # the same 5-minute spacing, offset by two minutes off that grid.
    #
    # STATUS: the phase shift did NOT work. docs/cadence.md re-measured it on
    # 2026-09-07 (median gap 174.6 min) and again on 2026-10-01 over all 568
    # runs: 4 to 9 runs a day through September, 6.0 a day on average over
    # the last 14 full days (17-30 Sep), median gap 240.6 min -- about 2% of
    # the 288 events a day requested. The cron is kept because nothing above
    # `*/5` exists to ask for, and reverting the phase would be one more
    # unverified guess. Reliable 5-minute detection is NOT achievable through
    # cron alone; what one delivered run buys is the poll loop in "Run bot"
    # below. See docs/cadence.md.
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"

# Least privilege: this job checks out the repo and calls external APIs. It
# never writes to the repository, opens a PR or publishes a package. The
# research workflows already declare this; without it the job inherits the
# repository-wide default, which is broader than anything here needs.
permissions:
  contents: read

# Add concurrency group to prevent parallel runs
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false


# Daily job to run the simple forecast bot
jobs:
  forecast_job:
    runs-on: ubuntu-latest # determines the machine that will run the job - keep as is
    steps: # sets up the steps that will be run in order
      # setup repository with all necessary dependencies - keep as is
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true
      # Adding the below will make the workflow faster, but will mean you don't automatically get updates from forecasting-tools and other packages
      # - name: Load cached venv
      #   id: cached-poetry-dependencies
      #   uses: actions/cache@v4
      #   with:
      #     path: .venv
      #     key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}
      - name: Install dependencies
        run: poetry install --no-interaction --no-root
      # forecasting-tools assigns the researcher role to a model OpenRouter no
      # longer serves, which 404s every question. This activates the pinned llms
      # block in main.py so the run uses models that actually exist.
      # The fallback chain activates only for keys present HERE: pin_models.py
      # reads os.environ at patch time, so a secret that reaches the bot step
      # but not this one produces a chain that silently stays empty.
      - name: Pin LLM models
        run: python backtest/pin_models.py
        env:
          # R11 -- ONE Gemini credential, deliberately.
          #
          # The code that turned extra Gemini credentials into extra chains
          # (added in d6e60ca: bucket_backend, limiter_key, one chain per
          # credential) has been removed, so nothing reads GEMINI2/3/4_API_KEY
          # any more. They are NOT passed to production, and any repository
          # secrets of those names can be deleted.
          #
          # Why: four credentials from four Google projects, driven by one
          # application, obtain 4 x 15 = 60 RPM where one project allows 15.
          #   FACT   Google documents "Rate limits are applied per project, not
          #          per API key", and separate projects as the mechanism for
          #          isolated quota.
          #   FACT   Google APIs ToS 2.d: Google sets and enforces API limits
          #          "in our sole discretion" and the developer agrees not to
          #          attempt to circumvent them; exceeding documented limits
          #          needs Google's express written consent.
          #   UNKNOWN No Google document states whether one workload spanning
          #          several projects is permitted or is circumvention.
          # "Not mentioned" is not "allowed", and the downside is asymmetric: a
          # quota-circumvention finding restricts the projects, and it would do
          # so mid-tournament.
          #
          # The cost of one credential is throughput in a DEGRADED mode only.
          # Gemini is the second link of OpenRouter -> Gemini -> Groq and is
          # reached only when OpenRouter actually fails. A saturated limiter
          # makes the call WAIT, not fail, and past the 300s ceiling it
          # raises RateLimitTimeout, which fails over to Groq. Prediction
          # counts, aggregation and the success threshold are untouched either
          # way.
          #
          # To re-enable after establishing compliance: restore the removed
          # code from git history (`git log -S bucket_backend`), add the three
          # env vars back to BOTH the pin step and the Run bot step, and
          # delete the assertion in tests/test_production_invariants.py.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Gates the chain at PATCH time. pin_models reads os.environ here to
          # decide which backends to write into the llms= block, so a key that
          # reaches "Run bot" but not this step produces a SHORTER chain with
          # no error: claude-haiku-4.5 silently vanished from the ensemble and
          # from the parser in production while every E2E passed, because
          # test_bot.yaml had this key and these two did not.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Gates the researcher's news feed at PATCH time, like the keys
          # above: pin_models leads the researcher with AskNews only when one
          # of these is present here. Absent (no secret set) means no change.
          # Must match the Run bot step; test_production_invariants compares.
          ASKNEWS_API_KEY: ${{ secrets.ASKNEWS_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
      # notifications/state.json is the ONLY thing the WhatsApp notifier
      # needs to survive between runs (which events were already sent -- see
      # notifications/state.py's module docstring for why that is the sole
      # piece of state that cannot be recovered from Metaculus). This uses
      # actions/cache rather than a git commit-back so this workflow's
      # `permissions: contents: read` (identical to every other workflow in
      # this repository) does not need to change.
      #
      # Documented limitation, accepted deliberately: a cache entry can be
      # evicted after 7 days unused, or once the repo's 10GB cache cap is
      # hit. Either failure mode means, AT WORST, one already-sent WhatsApp
      # event gets re-sent once after the loss -- never a duplicate silently
      # hidden, never anything touching forecasting, scoring or publication.
      # The exact-key match first (this run's own retry, if any) then the
      # `restore-keys` prefix match (the most recent previous run) is the
      # standard evolving-cache pattern; cache keys are immutable, so saving
      # is keyed per run and restoring is what finds the latest one.
      - name: Restore notification state
        uses: actions/cache/restore@v4
        with:
          path: notifications/state.json
          key: notification-state-${{ github.run_id }}
          restore-keys: |
            notification-state-
      # POLLING LOOP, not a single shot. R8 follow-up.
      #
      # docs/cadence.md measured `*/5` delivering 32 min median gaps (14% of
      # the 12 events/hour requested) and recorded the phase-shift as an
      # UNVERIFIED mitigation to be re-measured. Re-measured 2026-09-07 over
      # the 200 most recent runs: it did not work. Delivery has fallen to
      #
      #     median gap 174.6 min, 2.6% of requested, max 299 min
      #
      # and last night MiniBench opened two batches 5 hours apart with the bot
      # blind in between. `*/5` is already GitHub's documented ceiling -- "the
      # shortest interval you can run scheduled workflows is once every 5
      # minutes" -- so asking for MORE is not a lever that exists. Events are
      # dropped, not delayed, and nothing here can raise the delivery rate.
      #
      # What IS available: make each delivered run cover more wall-clock time.
      # One event that arrives now buys POLL_WINDOW_SECONDS of real 5-minute
      # detection instead of the ~60 seconds it used to buy.
      #
      # Cost is close to nothing. A poll with no new question is two discovery
      # calls; skip_previously_forecasted_questions=True means LLM tokens are
      # spent only when something new actually opens. The repository is
      # public, so standard-runner minutes are free.
      #
      # SIZING -- corrected 2026-09-12, after the first version exhausted the
      # account's Actions allowance in two days.
      #
      # The first version used a 3h window, reasoning that matching the median
      # gap between delivered events would let runs hand over to one another.
      # It said, in this very comment, that the point was to avoid "turning a
      # scheduled job into a permanently resident process". That is precisely
      # what it did, and the mechanism was in the file the whole time:
      # `cancel-in-progress: false` QUEUES the scheduled events that arrive
      # during a run, so the moment one 3h run ends the queued one starts.
      # Observed: 3h13m, 3h00m, 3h01m, 3h32m, 5h13m, 4h10m ... back to back,
      # ~24h of runner time per day.
      #
      # What it bought was almost nothing. MiniBench opens a batch roughly
      # every two weeks and tournament 33022 has had no open questions for
      # weeks, so the overwhelming majority of polls discovered zero questions.
      # Paying continuous occupancy for a bi-weekly event is the wrong trade
      # however good the detection latency is.
      #
      # Two changes, and the second matters more than the first:
      #   * the window is 40 minutes, not 3 hours;
      #   * the window ENDS EARLY once POLL_IDLE_LIMIT consecutive polls find
      #     zero open questions. When the tournaments are quiet a run now costs
      #     about two polls; when a batch is actually open the loop keeps its
      #     5-minute granularity for the full window, which is the only time
      #     that granularity was ever worth anything.
      #
      # A poll that fails does NOT abort the window -- one bad question, or one
      # provider outage, must not blind the bot for the remaining hours. But a
      # window in which EVERY poll failed is a real failure and exits non-zero,
      # so the WhatsApp failure notifier below still fires on a systemic break.
      - name: Run bot
        # Must exceed POLL_WINDOW_SECONDS plus the longest single poll, and
        # stay well under GitHub's 6h job ceiling.
        timeout-minutes: 55
        run: |
          set -uo pipefail
          window="${POLL_WINDOW_SECONDS}"
          interval="${POLL_INTERVAL_SECONDS}"
          idle_limit="${POLL_IDLE_LIMIT}"
          deadline=$(( $(date +%s) + window ))
          polls=0
          failures=0
          idle=0
          while : ; do
            polls=$(( polls + 1 ))
            echo "::group::poll ${polls}"
            out="$(mktemp)"
            if poetry run python main.py 2>&1 | tee "${out}"; then
              echo "poll ${polls}: ok"
            else
              failures=$(( failures + 1 ))
              echo "poll ${polls}: exited non-zero (failures=${failures})"
            fi
            # How many open questions discovery actually found, summed across
            # tournaments. discovery.py emits one line per tournament:
            #   discovery_complete tournament=<id> pages=<n> questions=<n>
            found="$(grep 'discovery_complete' "${out}" \
                     | grep -o 'questions=[0-9]*' | cut -d= -f2 \
                     | awk '{t+=$1} END {print t+0}')"
            marker="$(grep -c 'discovery_complete' "${out}" || true)"
            rm -f "${out}"
            echo "poll ${polls}: discovered ${found} open question(s)"
            if [ "${marker}" -eq 0 ]; then
              # No discovery line at all: the run died before discovery, or
              # discovery.py changed its log format. Either way this heuristic
              # cannot speak, so it does not get a vote -- keep polling and let
              # the window bound the cost. test_production_invariants pins the
              # marker so the second case fails loudly instead.
              idle=0
            elif [ "${found}" -eq 0 ]; then
              idle=$(( idle + 1 ))
            else
              idle=0
            fi
            if [ "${idle}" -ge "${idle_limit}" ]; then
              echo "poll_window_early_exit polls=${polls} idle=${idle}"
              break
            fi
            now=$(date +%s)
            if [ "${now}" -ge "${deadline}" ]; then break; fi
            remaining=$(( deadline - now ))
            nap="${interval}"
            if [ "${remaining}" -lt "${nap}" ]; then nap="${remaining}"; fi
            sleep "${nap}"
          done
          echo "poll_window_complete polls=${polls} failures=${failures}"
          if [ "${failures}" -eq "${polls}" ]; then
            echo "::error::every poll in this window failed"
            exit 1
          fi
        # this reads the environment variables from the github repository.
        # Store under Settings --> Secrets and variables --> Actions
        env:
          # 40 minutes, not 3 hours. See the sizing note above the step.
          POLL_WINDOW_SECONDS: "2400"
          POLL_INTERVAL_SECONDS: "300"
          # Consecutive polls finding ZERO open questions before the window
          # ends early. Two, because one empty poll is normal between batches
          # and two in a row means the tournaments are genuinely quiet.
          POLL_IDLE_LIMIT: "2"
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }} # replace this with the name of the variable under which you stored your own Metaculus token
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ASKNEWS_API_KEY: ${{ secrets.ASKNEWS_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
          # Fallback providers. Both verified by research/smoke_test_providers.py
          # before being wired in; absent keys simply disable their leg.
          # See the R11 note on the pin step above: one Gemini credential,
          # on purpose.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # WhatsApp status notifications (notifications/ + scripts/notify.py).
          # Absent secrets simply mean handle_run()'s send() call fails and
          # main.py logs and continues -- see notifications/integration.py.
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          CALLMEBOT_PHONE_NUMBER: ${{ secrets.CALLMEBOT_PHONE_NUMBER }}
      # PRACTICE, NOT PRIZES. Metaculus Cup Fall 2026 (tournaments.METACULUS_CUP)
      # ranks bots against the human crowd but pays none; the FutureEval
      # resources page recommends it for measuring a bot on diverse questions.
      #
      # Why a step here and not a second scheduled workflow: this job is the
      # one scheduled publisher, it already ran the pin step (so the Cup gets
      # the same models as the scored tournament), and it already serialises
      # itself. A second schedule would be a second publisher under the same
      # token, which tests/test_production_invariants.py forbids.
      #
      # Why AFTER the poll window and not inside it: the window's early exit
      # counts open questions, and the Cup almost always has some, so adding
      # it to the loop would keep every run alive for the full 40 minutes.
      #
      # Cost: each Cup question is forecast when first seen and refreshed once
      # its latest forecast is a week old (market_pulse.select_stale), so
      # ~25 open questions cost ~25 forecasts a week. A run with nothing due
      # costs one discovery call. A backlog can be large, hence the timeout.
      - name: Forecast new Metaculus Cup questions (practice)
        timeout-minutes: 90
        run: poetry run python main.py --mode metaculus_cup
        # The same credentials as "Run bot" minus the poll settings and
        # WhatsApp (handle_run only reports tournament mode). A key missing
        # here would silently shorten the fallback chain for the Cup only;
        # test_production_invariants compares the two blocks.
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ASKNEWS_API_KEY: ${{ secrets.ASKNEWS_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      # PRIZES. Market Pulse Challenge 26Q4 (tournaments.MARKET_PULSE): $7,500,
      # bot-eligible, ~65 numeric group subquestions on earnings and markets.
      # Outside the poll window for the same reason as the Cup: it always has
      # open questions, which would defeat the window's early exit.
      #
      # Spot scored at each close, so the market_pulse mode forecasts new
      # questions AND refreshes those closing within 36h whose last forecast is
      # 18h+ old (market_pulse.py). At ~6 delivered runs a day that is one or
      # two refreshes per question; a run with nothing due costs one discovery.
      # A failed Cup run (practice) must not cost a prize-scored refresh.
      - name: Forecast Market Pulse questions (prize)
        if: ${{ !cancelled() }}
        timeout-minutes: 90
        run: poetry run python main.py --mode market_pulse
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ASKNEWS_API_KEY: ${{ secrets.ASKNEWS_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      # Runs whether "Run bot" succeeded or failed, so a partial run's
      # already-sent events are still remembered. actions/cache/save is a
      # no-op (not an error) if this exact key was already saved earlier in
      # the same run_id (a retry after a later step failed).
      - name: Save notification state
        if: always()
        # Verified against actions/cache's own source (saveImpl.ts): a
        # missing path or an already-existing key are both logged as
        # warnings, never core.setFailed() -- this step should not be able
        # to fail the job on its own either way. continue-on-error is
        # defense in depth against whatever that source-reading did not
        # cover (a genuine GitHub cache-service outage), so a cache hiccup
        # can never be mistaken for "the bot failed" by the next step.
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: notifications/state.json
          key: notification-state-${{ github.run_id }}
      # Separate from the in-process notifier: this fires only when a STEP
      # in this job failed outright (including one earlier than "Run bot"),
      # which main.py's own try/except around handle_run() cannot see at all
      # -- if main.py never started, or crashed before reaching that call,
      # nothing inside it can report anything. No persisted state needed
      # here: each job attempt fires this at most once, so there is nothing
      # to deduplicate across runs.
      - name: Notify WhatsApp on workflow failure
        if: failure()
        continue-on-error: true
        run: |
          python scripts/notify.py whatsapp --message "🚨 METACULUS BOT: el workflow run_bot_on_tournament falló antes de completarse (run ${{ github.run_id }}, intento ${{ github.run_attempt }})"
        env:
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          CALLMEBOT_PHONE_NUMBER: ${{ secrets.CALLMEBOT_PHONE_NUMBER }}
